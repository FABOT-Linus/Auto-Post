name: Daily Financial News Post

on:
  schedule:
    # 9:40 AM ET (13:40 UTC) — Morning Market Digest
    - cron: '40 13 * * 1-5'
    # 4:10 PM ET (20:10 UTC) — Afternoon Market Close
    - cron: '10 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine post label
        id: label
        run: |
          # Auto-detect morning vs afternoon based on UTC hour
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 16 ]; then
            echo "post_label=☀️ Morning Market Digest" >> $GITHUB_OUTPUT
            echo "post_subtitle=MORNING DIGEST" >> $GITHUB_OUTPUT
          else
            echo "post_label=🌅 Afternoon Market Close" >> $GITHUB_OUTPUT
            echo "post_subtitle=AFTERNOON CLOSE" >> $GITHUB_OUTPUT
          fi

      - name: Run Daily Financial News Poster
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS }}
          NEWS_CATEGORIES: ${{ vars.NEWS_CATEGORIES }}
          MAX_HEADLINES: ${{ vars.MAX_HEADLINES }}
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM }}
          ENABLE_LINKEDIN: ${{ vars.ENABLE_LINKEDIN }}
          POST_LABEL: ${{ steps.label.outputs.post_label }}
          POST_IMAGE_SUBTITLE: ${{ steps.label.outputs.post_subtitle }}
        run: |
          python main.py 2>&1 | tee post_output.log

      - name: Save posted-headline history
        if: always()
        run: |
          if [ -n "$(git status --porcelain post_history.json)" ]; then
            git config user.name "BOBNews Bot"
            git config user.email "actions@github.com"
            git add post_history.json
            git commit -m "Update post history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi

      - name: Email notification
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "BOBNews Daily Post - ${{ job.status }}"
          body: "file://post_output.log"
          to: ${{ secrets.EMAIL_TO }}
          from: "BOBNews Bot"
