name: Daily Financial News Post

on:
  schedule:
    # Runs at 08:00 UTC daily (adjust as needed)
    # UTC 08:00 = 04:00 ET / 01:00 PT
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Financial News Poster
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS }}
          NEWS_CATEGORIES: ${{ vars.NEWS_CATEGORIES }}
          MAX_HEADLINES: ${{ vars.MAX_HEADLINES }}
          ENABLE_X: ${{ vars.ENABLE_X }}
          ENABLE_X_IMAGE: ${{ vars.ENABLE_X_IMAGE }}
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM }}
          ENABLE_LINKEDIN: ${{ vars.ENABLE_LINKEDIN }}
        run: |
          cd src
          python main.py
