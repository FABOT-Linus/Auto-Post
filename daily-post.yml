name: Daily Financial News Post

on:
  schedule:
    # 9:10am ET and 4:10pm ET, expressed in UTC.
    # These times are for US Eastern Daylight Time (UTC-4), which is in
    # effect roughly mid-March to early November. During Eastern Standard
    # Time (UTC-5, ~early Nov to mid-March) these will fire an hour later
    # local time (10:10am / 5:10pm) — GitHub Actions cron doesn't observe DST.
    - cron: "10 13 * * *"  # 9:10am ET
    - cron: "10 20 * * *"  # 4:10pm ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Financial News Poster
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER_URN: ${{ secrets.LINKEDIN_MEMBER_URN }}
          NEWS_KEYWORDS: ${{ vars.NEWS_KEYWORDS }}
          NEWS_CATEGORIES: ${{ vars.NEWS_CATEGORIES }}
          MAX_HEADLINES: ${{ vars.MAX_HEADLINES }}
          ENABLE_X: ${{ vars.ENABLE_X }}
          ENABLE_X_IMAGE: ${{ vars.ENABLE_X_IMAGE }}
          ENABLE_FACEBOOK: ${{ vars.ENABLE_FACEBOOK }}
          ENABLE_INSTAGRAM: ${{ vars.ENABLE_INSTAGRAM }}
          ENABLE_LINKEDIN: ${{ vars.ENABLE_LINKEDIN }}
        run: |
          python main.py 2>&1 | tee post_output.log

      - name: Save posted-headline history
        if: always()
        run: |
          if [ -n "$(git status --porcelain post_history.json)" ]; then
            git config user.name "BOBNews Bot"
            git config user.email "actions@github.com"
            git add post_history.json
            git commit -m "Update post history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi

      - name: Email notification
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "BOBNews Daily Post - ${{ job.status }}"
          body: "file://post_output.log"
          to: ${{ secrets.EMAIL_TO }}
          from: "BOBNews Bot"
